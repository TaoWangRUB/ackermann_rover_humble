<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autonomous Rover — ROS 2 / Nav2 / PX4 Runtime Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12; --bg2:#0b1220; --grid:rgba(86,120,160,.07);
  --ink:#e8eef7; --ink-dim:#8497ad; --line:#2c3a4f; --line-soft:#1c2738;
  --panel:rgba(13,20,33,.92); --panel-bd:rgba(120,150,190,.18);
  --cam:#34d399; --rtab:#fbbf24; --nav:#38bdf8; --px4:#f472b6;
  --bridge:#a78bfa; --fw:#c084fc; --act:#fb923c; --misc:#94a3b8;
  --cmd:#94a3b8; --io:#94a3b8; --mon:#94a3b8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;
  background:
    radial-gradient(1200px 800px at 70% -10%, rgba(56,189,248,.10), transparent 60%),
    radial-gradient(1000px 700px at 10% 110%, rgba(244,114,182,.08), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
}
#grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),
                   linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:42px 42px;mask:radial-gradient(120% 120% at 50% 40%,#000 55%,transparent 100%)}
header{position:absolute;top:0;left:0;right:0;z-index:6;padding:16px 22px;
  display:flex;flex-direction:column;gap:6px;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,11,18,.85),transparent)}
header .row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:"Chakra Petch",sans-serif;font-weight:700;letter-spacing:.5px;
  font-size:19px;margin:0;text-transform:uppercase}
h1 .dot{color:var(--nav)}
.sub{font-size:12px;color:var(--ink-dim);font-family:"IBM Plex Mono",monospace}
.cmdline{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#6f86a0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.cmdline b{color:var(--cam);font-weight:600}
svg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
svg.grabbing{cursor:grabbing}
/* clusters */
.cluster rect{rx:14;fill:rgba(255,255,255,.012);stroke-width:1.4;
  stroke-dasharray:2 5;transition:opacity .2s, stroke .2s}
.cluster text{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:13px;
  letter-spacing:.4px;text-transform:uppercase}
.cluster.sub-cam rect{stroke:var(--cam)} .cluster.sub-cam text{fill:var(--cam)}
.cluster.sub-rtab rect{stroke:var(--rtab)} .cluster.sub-rtab text{fill:var(--rtab)}
.cluster.sub-nav rect{stroke:var(--nav)} .cluster.sub-nav text{fill:var(--nav)}
.cluster.sub-px4 rect{stroke:var(--px4)} .cluster.sub-px4 text{fill:var(--px4)}
/* edges */
.edge path{fill:none;stroke:var(--line);stroke-width:1.5;transition:stroke .18s,stroke-width .18s,opacity .18s}
.edge .arr{fill:var(--line);transition:fill .18s,opacity .18s}
.edge .elabel rect{fill:rgba(10,16,26,.9);stroke:var(--line-soft);stroke-width:1;rx:4}
.edge .elabel text{font-family:"IBM Plex Mono",monospace;font-size:10px;fill:#9fb2c9}
.edge.dashed path{stroke-dasharray:6 5}
.edge.dotted path{stroke-dasharray:1.5 6;stroke-linecap:round}
/* nodes */
.node rect{rx:9;fill:#0e1726;stroke-width:1.4;transition:filter .2s,stroke .2s,opacity .2s,transform .12s}
.node .t1{font-weight:600;font-size:11px;fill:var(--ink)}
.node .t2{font-size:9.5px;fill:var(--ink-dim);font-family:"IBM Plex Mono",monospace}
.node{cursor:pointer}
.node.sub-cam rect{stroke:var(--cam)} .node.sub-rtab rect{stroke:var(--rtab)}
.node.sub-nav rect{stroke:var(--nav)} .node.sub-px4 rect{stroke:var(--px4)}
.node.sub-bridge rect{stroke:var(--bridge)} .node.sub-fw rect{stroke:var(--fw)}
.node.sub-act rect{stroke:var(--act)} .node.sub-cmd rect{stroke:var(--cmd)}
.node.sub-io rect{stroke:var(--io)} .node.sub-mon rect{stroke:var(--mon)}
.node.sub-misc rect{stroke:var(--misc)}
/* highlight state */
svg.focusing .node:not(.hot){opacity:.16}
svg.focusing .edge:not(.hot){opacity:.07}
svg.focusing .cluster:not(.hot){opacity:.35}
.edge.hot path{stroke-width:2.4;stroke-dasharray:9 7;animation:flow 1s linear infinite}
.edge.hot path{stroke:#cfe3f5;fill:none} .edge.hot .arr{fill:#cfe3f5}
.edge.hot.sub-cam path{stroke:var(--cam)} .edge.hot.sub-cam .arr{fill:var(--cam)}
.edge.hot.sub-rtab path{stroke:var(--rtab)} .edge.hot.sub-rtab .arr{fill:var(--rtab)}
.edge.hot.sub-nav path{stroke:var(--nav)} .edge.hot.sub-nav .arr{fill:var(--nav)}
.edge.hot.sub-px4 path{stroke:var(--px4)} .edge.hot.sub-px4 .arr{fill:var(--px4)}
.edge.hot.sub-bridge path{stroke:var(--bridge)} .edge.hot.sub-bridge .arr{fill:var(--bridge)}
.edge.hot.sub-fw path{stroke:var(--fw)} .edge.hot.sub-fw .arr{fill:var(--fw)}
@keyframes flow{to{stroke-dashoffset:-16}}
.node.hot rect{filter:drop-shadow(0 0 9px currentColor);transform:translateY(-1px)}
.node.sel rect{stroke-width:2.4;filter:drop-shadow(0 0 12px currentColor)}
.node.sub-cam.hot rect{color:var(--cam)} .node.sub-rtab.hot rect{color:var(--rtab)}
.node.sub-nav.hot rect{color:var(--nav)} .node.sub-px4.hot rect{color:var(--px4)}
.node.sub-bridge.hot rect{color:var(--bridge)} .node.sub-fw.hot rect{color:var(--fw)}
.node.sub-act.hot rect{color:var(--act)} .node.hot rect{color:#7fd3ff}
/* controls */
.controls{position:absolute;right:18px;bottom:18px;z-index:6;display:flex;flex-direction:column;gap:7px}
.controls button{width:38px;height:38px;border-radius:10px;border:1px solid var(--panel-bd);
  background:var(--panel);color:var(--ink);font-size:17px;cursor:pointer;
  backdrop-filter:blur(8px);transition:.15s;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace}
.controls button:hover{border-color:var(--nav);color:var(--nav)}
.controls .lbl{font-size:11px}
/* legend */
.legend{position:absolute;left:18px;bottom:18px;z-index:6;display:flex;gap:8px;flex-wrap:wrap;
  max-width:46vw}
.legend .chip{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:20px;
  background:var(--panel);border:1px solid var(--panel-bd);font-size:11px;cursor:pointer;
  backdrop-filter:blur(8px);transition:.15s;color:var(--ink-dim);font-family:"IBM Plex Mono",monospace}
.legend .chip:hover{color:var(--ink);border-color:currentColor}
.legend .chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .chip.off{opacity:.4}
/* detail panel */
#panel{position:absolute;top:0;right:0;height:100%;width:360px;max-width:88vw;z-index:7;
  background:var(--panel);backdrop-filter:blur(14px);border-left:1px solid var(--panel-bd);
  transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;padding:22px 22px 26px}
#panel.open{transform:none}
#panel .x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;
  border:1px solid var(--panel-bd);background:transparent;color:var(--ink-dim);cursor:pointer;font-size:15px}
#panel .x:hover{color:var(--ink)}
#panel .kicker{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:1px;
  text-transform:uppercase;margin-bottom:4px}
#panel h2{font-family:"Chakra Petch",sans-serif;font-size:21px;margin:0 0 10px;line-height:1.15}
#panel .desc{font-size:13.5px;line-height:1.6;color:#c4d2e3;margin-bottom:18px}
#panel .io h3{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-dim);
  margin:16px 0 8px;font-family:"IBM Plex Mono",monospace}
#panel .io ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#panel .io li{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.4;
  padding:7px 10px;border-radius:7px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft)}
#panel .io li b{color:var(--ink)} #panel .io .topic{color:#7fd3ff}
.hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:5;
  color:var(--ink-dim);font-family:"IBM Plex Mono",monospace;font-size:12px;text-align:center;
  pointer-events:none;opacity:.0;transition:opacity .4s}
@media(max-width:760px){h1{font-size:15px}.cmdline{display:none}.legend{max-width:64vw}}
</style>
</head>

const M=DATA.model, DESC=DATA.desc, SUBS=DATA.subs;

M.nodes.forEach(n=>{inc[n.id]=[];out[n.id]=[];nbr[n.id]=new Set();});
M.edges.forEach((e,i)=>{e._i=i; out[e.s].push(e); inc[e.t].push(e);
  nbr[e.s].add(e.t); nbr[e.t].add(e.s);});

function el(t,a){const x=document.createElementNS(SVGNS,t);for(const k in (a||{}))x.setAttribute(k,a[k]);return x;}
const vp=el('g',{id:'vp'}); svg.appendChild(vp);
const gClus=el('g'),gEdge=el('g'),gNode=el('g');
vp.appendChild(gClus);vp.appendChild(gEdge);vp.appendChild(gNode);

// clusters
M.clusters.forEach(c=>{
  const g=el('g',{class:'cluster sub-'+c.sub}); g.dataset.sub=c.sub;
  g.appendChild(el('rect',{x:c.x,y:c.y,width:c.w,height:c.h,rx:14}));
  const tx=el('text',{x:c.x+14,y:c.y+20}); tx.textContent=c.label;
  g.appendChild(tx); gClus.appendChild(g); c._g=g;
});

// edges
function pathD(p){if(p.length<2)return'';let d='M'+p[0][0]+','+p[0][1];let i=1;
  while(i+2<p.length){d+=' C'+p[i][0]+','+p[i][1]+' '+p[i+1][0]+','+p[i+1][1]+' '+p[i+2][0]+','+p[i+2][1];i+=3;}
  while(i<p.length){d+=' L'+p[i][0]+','+p[i][1];i++;}return d;}
function arrow(p){const a=p[p.length-2],b=p[p.length-1];
  const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1;const ux=dx/L,uy=dy/L;
  const s=8,w=3.2;const bx=b[0]-ux*s,by=b[1]-uy*s;const px=-uy,py=ux;
  return [b,[bx+px*w,by+py*w],[bx-px*w,by-py*w]].map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');}
M.edges.forEach(e=>{
  const g=el('g',{class:'edge sub-'+e.ssub+(e.style!=='solid'?' '+e.style:'')});
  g.dataset.s=e.s;g.dataset.t=e.t;
  if(e.pts&&e.pts.length){
    g.appendChild(el('path',{d:pathD(e.pts)}));
    if(e.style!=='dotted') g.appendChild(el('polygon',{class:'arr',points:arrow(e.pts)}));
  }
  gEdge.appendChild(g); e._g=g;
});
// edge labels (size after insert)
M.edges.forEach(e=>{
  if(!e.label||!e.lp)return;
  const lg=el('g',{class:'elabel'});
  const lines=e.label.split('\n');
  const t=el('text',{'text-anchor':'middle'});
  lines.forEach((ln,i)=>{const ts=el('tspan',{x:e.lp[0],dy:(i===0?0:11)});ts.textContent=ln;t.appendChild(ts);});
  t.setAttribute('y',e.lp[1]-(lines.length-1)*5.5);
  const r=el('rect',{}); lg.appendChild(r); lg.appendChild(t); e._g.appendChild(lg);
  requestAnimationFrame(()=>{const bb=t.getBBox();
    r.setAttribute('x',bb.x-4);r.setAttribute('y',bb.y-2);
    r.setAttribute('width',bb.width+8);r.setAttribute('height',bb.height+4);});
});

// nodes
M.nodes.forEach(n=>{
  const g=el('g',{class:'node sub-'+n.sub}); g.dataset.id=n.id;
  const w=n.w+6, h=n.h+2, x=n.cx-w/2, y=n.cy-h/2;
  g.appendChild(el('rect',{x:x,y:y,width:w,height:h,rx:9}));
  const lines=n.label.split('\n'); const lh=12;
  const t=el('text',{'text-anchor':'middle'});
  const y0=n.cy-(lines.length-1)*lh/2+3.5;
  lines.forEach((ln,i)=>{
    const ts=el('tspan',{x:n.cx,y:y0+i*lh,class:i===0?'t1':'t2'});ts.textContent=ln;t.appendChild(ts);});
  g.appendChild(t); gNode.appendChild(g); n._g=g;
});

let pinned=null, hiddenSubs=new Set();
function focus(id){
  const keepE=new Set(), keepN=new Set([id]);
  [...inc[id],...out[id]].forEach(e=>{keepE.add(e._i);keepN.add(e.s);keepN.add(e.t);});
  svg.classList.add('focusing');
  M.nodes.forEach(n=>n._g.classList.toggle('hot',keepN.has(n.id)));
  M.edges.forEach(e=>e._g.classList.toggle('hot',keepE.has(e._i)));
  M.clusters.forEach(c=>{
    const any=M.nodes.some(n=>keepN.has(n.id)&&n.sub===c.sub);
    c._g.classList.toggle('hot',any);});
}
function clearFocus(){svg.classList.remove('focusing');
  document.querySelectorAll('.hot').forEach(x=>x.classList.remove('hot'));}
function refocus(){ if(pinned) focus(pinned); else clearFocus(); }

M.nodes.forEach(n=>{
  n._g.addEventListener('mouseenter',()=>{if(!dragging)focus(n.id);});
  n._g.addEventListener('mouseleave',()=>{if(!dragging)refocus();});
  n._g.addEventListener('click',ev=>{ev.stopPropagation();select(n.id);});
});

// ===== detail panel =====
const panel=document.getElementById('panel');
function select(id){
  pinned=id; focus(id);
  document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));
  byId[id]._g.classList.add('sel');
  const n=byId[id];
  document.getElementById('pk').textContent=(SUBS[n.sub]?SUBS[n.sub][0]:n.sub);
  document.getElementById('pk').style.color=(SUBS[n.sub]?SUBS[n.sub][1]:'#94a3b8');
  document.getElementById('pt').textContent=n.label.split('\n')[0];
  document.getElementById('pd').textContent=DESC[id]||'';
  const io=document.getElementById('pio');io.innerHTML='';
  function block(title,arr,key){
    if(!arr.length)return;
    const h=document.createElement('h3');h.textContent=title;io.appendChild(h);
    const ul=document.createElement('ul');
    arr.forEach(e=>{const li=document.createElement('li');
      const other=byId[e[key]]; const onm=other?other.label.split('\n')[0]:e[key];
      const top=e.label?'<span class="topic"> '+e.label.replace(/\n/g,' ')+'</span>':'';
      li.innerHTML='<b>'+onm+'</b>'+top; ul.appendChild(li);});
    io.appendChild(ul);
  }
  block('Inputs ← ',inc[id],'s');
  block('Outputs → ',out[id],'t');
  panel.classList.add('open');
}
function closePanel(){panel.classList.remove('open');pinned=null;
  document.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));clearFocus();}
document.getElementById('px').addEventListener('click',closePanel);
svg.addEventListener('click',()=>{if(pinned)closePanel();});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});

// ===== legend (subsystem highlight) =====
const legend=document.getElementById('legend');
['cam','rtab','nav','px4','bridge','fw','act'].forEach(s=>{
  if(!SUBS[s])return;
  const c=document.createElement('div');c.className='chip';c.dataset.sub=s;
  c.innerHTML='<i style="background:'+SUBS[s][1]+'"></i>'+SUBS[s][0];
  c.addEventListener('mouseenter',()=>{if(pinned)return;
    svg.classList.add('focusing');
    M.nodes.forEach(n=>n._g.classList.toggle('hot',n.sub===s));
    M.edges.forEach(e=>e._g.classList.toggle('hot',e.ssub===s));
    M.clusters.forEach(cl=>cl._g.classList.toggle('hot',cl.sub===s));});
  c.addEventListener('mouseleave',()=>{if(!pinned)clearFocus();});
  legend.appendChild(c);
});

// ===== pan / zoom =====
let k=1,tx=0,ty=0,dragging=false,sx=0,sy=0;
function apply(){vp.setAttribute('transform','translate('+tx+','+ty+') scale('+k+')');}
function fit(){
  const r=svg.getBoundingClientRect();
  const padT=120,padB=70,padX=60;
  const kx=(r.width-padX*2)/M.W, kyv=(r.height-padT-padB)/M.H;
  k=Math.min(kx,kyv); k=Math.min(k,1.4);
  tx=(r.width-M.W*k)/2; ty=padT+((r.height-padT-padB)-M.H*k)/2;
  apply();
}
svg.addEventListener('wheel',e=>{e.preventDefault();
  const r=svg.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  const f=Math.exp(-e.deltaY*0.0012);const nk=Math.min(3.5,Math.max(.2,k*f));
  tx=mx-(mx-tx)*(nk/k); ty=my-(my-ty)*(nk/k); k=nk; apply();
},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;
  dragging=true;sx=e.clientX-tx;sy=e.clientY-ty;svg.classList.add('grabbing');svg.setPointerCapture(e.pointerId);});
svg.addEventListener('pointermove',e=>{if(!dragging)return;tx=e.clientX-sx;ty=e.clientY-sy;apply();});
svg.addEventListener('pointerup',e=>{dragging=false;svg.classList.remove('grabbing');});
function zoomC(f){const r=svg.getBoundingClientRect();const mx=r.width/2,my=r.height/2;
  const nk=Math.min(3.5,Math.max(.2,k*f));tx=mx-(mx-tx)*(nk/k);ty=my-(my-ty)*(nk/k);k=nk;apply();}
document.getElementById('zin').onclick=()=>zoomC(1.25);
document.getElementById('zout').onclick=()=>zoomC(.8);
document.getElementById('fit').onclick=fit;
window.addEventListener('resize',fit);
fit();
</script>
