syntax = "proto3";
package rover_monitor_proto;

message CamStatus {
  string camera_id = 1;
  bool connected = 2;
  float frame_delta_ms = 3;
  float depth_fps = 4;
  float depth_quality_sampled = 5;
  bool imu_active = 6;
  int32 error_code = 7;
  string error_msg = 8;
  int64 timestamp = 9;
}

message Px4Status {
  bool connected = 1;
  bool armed = 2;
  bool armable = 3;
  int32 nav_state = 4;
  string nav_state_label = 5;
  float battery_voltage_v = 6;
  float battery_current_a = 7;
  float battery_remaining_pct = 8;
  int32 heartbeat_age_ms = 9;
  int32 error_code = 10;
  string error_msg = 11;
  int64 timestamp = 12;
}

message JetsonStatus {
  repeated float cpu_usage_pct = 1;
  float gpu_usage_pct = 2;
  int32 ram_used_mb = 3;
  int32 ram_total_mb = 4;
  int32 swap_used_mb = 5;
  float disk_free_gb = 6;
  float temp_cpu_c = 7;
  float temp_gpu_c = 8;
  float temp_board_c = 9;
  bool is_thermal_throttled = 10;
  bool is_power_throttled = 11;
  string power_mode = 12;
  float wifi_signal_dbm = 13;
  int32 uptime_s = 14;
  int32 error_code = 15;
  string error_msg = 16;
  int64 timestamp = 17;
}

message RoverHealth {
  int32 seq = 1;
  int64 timestamp = 2;
  CamStatus camera = 3;
  Px4Status px4 = 4;
  JetsonStatus jetson = 5;
  // Legacy field name retained for compatibility.
  // Stores the age/freshness of the latest map->odom TF in milliseconds.
  float slam_latency_ms = 6;
  string overall_health = 7;
  repeated string active_alerts = 8;
}

// --- v1.2.0: Command System ---

enum CommandType {
  CMD_UNKNOWN = 0;
  CMD_NAV_GOAL = 1;
  CMD_ARM = 2;
  CMD_DISARM = 3;
  CMD_SET_MODE = 4;
  CMD_ESTOP = 5;
  CMD_CANCEL_GOAL = 6;
  CMD_SET_PARAM = 7;
  CMD_DRIVE = 8;
}

message DriveCmd {
  float speed_ms = 1;      // linear.x  (m/s, forward positive)
  float steering = 2;      // angular.z (normalized -1..+1, left positive in ROS)
}

enum AckStatus {
  ACK_RECEIVED = 0;
  ACK_ACCEPTED = 1;
  ACK_REJECTED = 2;
  ACK_COMPLETED = 3;
  ACK_FAILED = 4;
}

message NavGoal {
  double latitude = 1;
  double longitude = 2;
  double altitude = 3;
  float yaw_deg = 4;
}

message SetMode {
  string mode_name = 1;
}

message SetParam {
  string param_name = 1;
  string param_value = 2;
}

message RoverCommand {
  string cmd_id = 1;
  CommandType cmd_type = 2;
  int64 timestamp = 3;
  string issued_by = 4;
  NavGoal nav_goal = 5;
  SetMode set_mode = 6;
  SetParam set_param = 7;
  DriveCmd drive = 8;
}

message CommandAck {
  string cmd_id = 1;
  CommandType cmd_type = 2;
  AckStatus status = 3;
  string message = 4;
  int64 timestamp = 5;
  int32 round_trip_ms = 6;
}
