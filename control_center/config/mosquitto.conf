# Only the laptop itself can connect. The rover reaches the broker over
# Tailscale through the laptop's sidecar (tailscaled-xavier, 100.103.48.37),
# which hands each connection to the laptop's localhost. Anonymous access is
# then limited to this machine instead of every network the laptop joins.
# To let the rover in over the Wi-Fi instead (no internet), add a listener on
# the laptop's Wi-Fi address, e.g. `listener 1883 192.168.0.225`.
listener 1883 127.0.0.1
listener 1883 ::1
persistence true
persistence_location /mosquitto/data/
log_dest stdout
allow_anonymous true
