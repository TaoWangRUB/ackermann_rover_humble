planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["SmacPlanner"]
    SmacPlanner:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      allow_unknown: true
      max_planning_time: 1.5
      motion_model_for_search: REEDS_SHEPP
      minimum_turning_radius: 0.75
      cost_travel_multiplier: 2.0
      angle_quantization_bins: 72
      cache_obstacle_heuristic: true
      smooth_path: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["RegulatedPurePursuit"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 5.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: true
    RegulatedPurePursuit:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 1.5
      min_linear_vel: 0.0
      max_linear_accel: 2.0
      max_angular_accel: 5.0
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 3.0
      lookahead_time: 1.5
      regulate_max_angular_velocity: true
      rotate_to_heading_angular_vel: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      cmd_vel_topic: /cmd_vel_nav

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["SimpleSmoother"]
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 0.1
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    behavior_plugins:
      - "spin"
      - "backup"
      - "wait"
      - "drive_on_heading"
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: ackmann/base_footprint
    odom_topic: /odometry/filtered
    transform_tolerance: 0.2
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    goal_blackboard_id: goal
    goals_blackboard_id: goals
    nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 2

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    max_velocity: [3.0, 0.0, 1.5]
    min_velocity: [-3.0, 0.0, -1.5]
    max_accel: [2.0, 0.0, 2.0]
    max_decel: [-2.0, 0.0, -2.0]
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    smoothing_duration: 0.3
    input_topic: /cmd_vel_nav
    output_topic: /cmd_vel_nav

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: ackmann/base_footprint
      update_frequency: 10.0
      publish_frequency: 10.0
      transform_tolerance: 0.2
      rolling_window: true
      width: 15
      height: 15
      resolution: 0.05
      robot_radius: 0.35
      footprint_padding: 0.05
      footprint: "[[0.45, 0.25], [0.45, -0.25], [-0.45, -0.25], [-0.45, 0.25]]"
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: lidar
        lidar:
          topic: /rplidar/scan
          clearing: true
          marking: true
          max_obstacle_height: 0.8
          min_obstacle_height: 0.05
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.75

  costmap_filter_info_server:
    ros__parameters:
      use_sim_time: true

  costmap_filter:
    ros__parameters:
      use_sim_time: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: ackmann/base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.1
      width: 100
      height: 100
      origin_x: -50.0
      origin_y: -50.0
      track_unknown_space: true
      rolling_window: false
      robot_radius: 0.35
      footprint_padding: 0.05
      footprint: "[[0.45, 0.25], [0.45, -0.25], [-0.45, -0.25], [-0.45, 0.25]]"
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: lidar
        lidar:
          topic: /rplidar/scan
          max_obstacle_height: 0.8
          min_obstacle_height: 0.05
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 1.0

lifecycle_manager_nav2:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
