# ============================================================================
# DDS Topics Configuration — Cube Black (FMUv3) Ackermann Rover
# ============================================================================
#
# Trimmed topic list to reduce CPU load on Cube Black's STM32F427.
# The default PX4 dds_topics.yaml publishes 60+ topics; this file keeps
# only what the ROS 2 bridge actually needs.
#
# Usage:
#   1. Copy this file into the PX4 source tree:
#        cp dds_topics.yaml /px4/src/modules/uxrce_dds_client/dds_topics.yaml
#   2. Rebuild firmware:
#        cd /px4 && make px4_fmu-v3_rover
#   3. Flash the resulting .px4 firmware via QGC.
#
# Or use the helper script:
#   ./scripts/build_px4_rover_fw.sh
#
# Topic categories:
#   - publications:        PX4 → ROS 2 (uORB → DDS)
#   - subscriptions:       ROS 2 → PX4 (DDS → uORB), single-instance
#   - subscriptions_multi: ROS 2 → PX4, multi-instance
#
# Commented-out topics (prefixed "# DISABLED:") are available in default PX4
# but excluded here to save CPU. Re-enable by uncommenting if needed.
#
# ============================================================================
#####
#
# This file maps all the topics that are to be used on the uXRCE-DDS client.
#
#####
publications:
  - topic: /fmu/out/register_ext_component_reply
    type: px4_msgs::msg::RegisterExtComponentReply

  - topic: /fmu/out/arming_check_request
    type: px4_msgs::msg::ArmingCheckRequest
    rate_limit: 5.

