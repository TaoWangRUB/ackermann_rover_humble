/**:
  ros__parameters:
    publisher:
      broker_host: "localhost"
      broker_port: 1883
      reconnect_delay_s: 5
      telemetry_qos: 0
      alert_qos: 1
      cmd_qos: 2
      client_id: "x86_monitor_test"
      dedup_eviction_s: 30
      keep_alive_s: 45
      connect_timeout_s: 5
      heartbeat_interval_s: 1.0
      serialization: "protobuf"
      # EKF global origin. The rover has no GPS, so PX4 has no global position
      # and cannot run Hold (RC loss then falls back to Land + disarm) until
      # this origin is set. rover_monitor sends it whenever PX4 connects
      # without one; the Control Center can change it (disarmed only).
      # Default = the SITL origin (start_px4_sitl.sh).
      ekf_origin:
        auto_set: true
        latitude_deg: 51.4934
        longitude_deg: 7.4120
        altitude_m: 100.0
        retry_period_s: 2.0
        timeout_s: 5.0
