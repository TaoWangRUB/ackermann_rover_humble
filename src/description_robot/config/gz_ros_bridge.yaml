# Bridging Gazebo topics to ROS 2 topics

- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# D435i camera
- ros_topic_name: "/d435i/camera_info"
  gz_topic_name: "/d435i/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

- ros_topic_name: "/d435i/depth_image"
  gz_topic_name: "/d435i/depth_image"
