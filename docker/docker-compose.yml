version: '2.3'

services:
  ackermann_slam:
    image: ${IMAGE_NAME}_${ARCH}_${ROS_DISTRO}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION}
        ROS_DISTRO: ${ROS_DISTRO}
        GZ_DISTRO: ${GZ_DISTRO}
        ROS_UBUNTU_CODENAME: ${ROS_UBUNTU_CODENAME}
        USERNAME: ${USERNAME}
        USER_UID: ${USER_UID}
        USER_GID: ${USER_GID}
    container_name: ${CONTAINER_NAME}_${ARCH}

    env_file:
      - ../.env
    environment:
      # ARCH is set automatically from the shell via: export ARCH=$(uname -m)
      # Results in 'x86_64' on desktop or 'aarch64' on Jetson.
      - ARCH=${ARCH}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      - XDG_RUNTIME_DIR=/tmp
      - NVIDIA_VISIBLE_DEVICES=all
      # 'all' covers compute + graphics on both x86 NVIDIA and Jetson L4T.
      - NVIDIA_DRIVER_CAPABILITIES=all
      - UBUNTU_VERSION=${UBUNTU_VERSION}
      - ROS_DISTRO=${ROS_DISTRO}
      - GZ_DISTRO=${GZ_DISTRO}

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/workspace
      - ../gazebo_cache:/root/.gazebo
      - ${PX4_DIR}:/px4
      - ${REALSENSE_ROS_DIR}:/realsense-ros
      - /dev:/dev
      # JetPack 5 CUDA 11.4 toolkit — provides nvcc + cudart_static for
      # GPU-accelerated depth alignment. The host driver is 11.4.
      - /usr/local/cuda-11.4:/usr/local/cuda-11.4:ro

    network_mode: host
    ipc: host
    pid: host
    privileged: true
    shm_size: 2g

    # Works on both x86 (nvidia-container-toolkit) and Jetson (nvidia-container-runtime).
    runtime: nvidia

    working_dir: /workspace
    stdin_open: true   # -i
    tty: true          # -t
