version: '2.3'

services:
  ackermann_slam:
    image: ${IMAGE_NAME-ackermann_rover}_${ARCH-x86_64}_${ROS_DISTRO-jazzy}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UBUNTU_VERSION: ${UBUNTU_VERSION-24.04}
        ROS_DISTRO: ${ROS_DISTRO-jazzy}
        GZ_DISTRO: ${GZ_DISTRO-harmonic}
        ROS_UBUNTU_CODENAME: ${ROS_UBUNTU_CODENAME-noble}
        USERNAME: ${USERNAME-nvidia}
        USER_UID: ${USER_UID-1000}
        USER_GID: ${USER_GID-1000}
    container_name: ${CONTAINER_NAME-jazzy_slam}_${ARCH-x86_64}

    env_file:
      - ../.env
    environment:
      # ARCH is set automatically from the shell via: export ARCH=$(uname -m)
      # Results in 'x86_64' on desktop or 'aarch64' on Jetson.
      - ARCH=${ARCH-x86_64}
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_INDIRECT=0
      - XDG_RUNTIME_DIR=/tmp
      - NVIDIA_VISIBLE_DEVICES=all
      # 'all' covers compute + graphics on both x86 NVIDIA and Jetson L4T.
      - NVIDIA_DRIVER_CAPABILITIES=all
      # PRIME render offload — required on x86 hybrid laptops (Intel iGPU +
      # NVIDIA dGPU) so OpenGL/GLX apps (Gazebo, RViz) actually use the
      # NVIDIA card instead of falling back to the iGPU. Harmless on
      # desktop-class GPUs and on Jetson, so safe to leave on always.
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - UBUNTU_VERSION=${UBUNTU_VERSION-24.04}
      - ROS_DISTRO=${ROS_DISTRO-jazzy}
      - GZ_DISTRO=${GZ_DISTRO-harmonic}
      - CUDA_HOME=/usr/local/cuda
      - CUDA_PATH=/usr/local/cuda
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda/targets/${ARCH-x86_64}-linux/lib

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ..:/workspace
      - ../gazebo_cache:/root/.gazebo
      - ${PX4_DIR-../../PX4-Autopilot}:/px4
      - ${REALSENSE_ROS_DIR-../../realsense-ros}:/realsense-ros
      - /dev:/dev
      - /run/udev:/run/udev:ro
      # Auto-detected by scripts/lib/dc.sh on Jetson or x86. When no toolkit
      # is installed yet, the default fallback is docker/empty_cuda.
      - ${CUDA_HOST_MOUNT-../docker/empty_cuda}:/usr/local/cuda:ro

    network_mode: host
    ipc: host
    pid: host
    privileged: true
    shm_size: 2g
    group_add:
      # Jetson often exposes USB serial adapters as root:plugdev (gid 46).
      # Add that supplemental gid so the non-root container user can open
      # /dev/ttyUSB* without running the XRCE agent as root.
      - "46"

    # Works on both x86 (nvidia-container-toolkit) and Jetson (nvidia-container-runtime).
    runtime: nvidia

    working_dir: /workspace
    stdin_open: true   # -i
    tty: true          # -t
