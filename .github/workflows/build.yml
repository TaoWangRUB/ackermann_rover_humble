name: build

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install lint dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ament-cpplint cppcheck

      - name: Run cpplint (ament)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          ament_cpplint src/ackermann_control src/safety

      - name: Run cppcheck static analysis
        shell: bash
        run: |
          set -euo pipefail
          cppcheck --enable=warning,performance,style --std=c++17 --error-exitcode=1 \
            src/ackermann_control/src \
            src/safety/src

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install package dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # Remove submodule example package manifests so rosdep does not
          # process their deps (the ament_python examples can trigger pip
          # installs that shadow system modules).  Also drop COLCON_IGNORE
          # so colcon skips them during build.
          find src/px4-ros2-interface-lib/examples -name package.xml -delete
          touch src/px4-ros2-interface-lib/examples/COLCON_IGNORE
          touch src/px4-ros2-interface-lib/px4_ros2_py/COLCON_IGNORE 2>/dev/null || true
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -y

      - name: Build and test
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          # CMake's execute_process calls /usr/bin/python3 directly and may
          # not inherit PYTHONPATH set by setup.bash.  Add a .pth file so
          # the ROS Python packages are always on the default sys.path.
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          SITE=$(/usr/bin/python3 -c "import site; print(site.getsitepackages()[0])")
          echo "/opt/ros/jazzy/lib/python${PY_VER}/site-packages" | sudo tee "$SITE/ros-jazzy.pth" > /dev/null
          /usr/bin/python3 -c "import ament_package; print('ament_package:', ament_package.__file__)"
          # Stage 1: Build px4_msgs first.
          colcon build --symlink-install --packages-select px4_msgs
          source install/setup.bash
          # Stage 2: Build px4_ros2_cpp (needs px4_msgs on CMAKE_PREFIX_PATH
          # because it calls ament_index_get_resource() at configure time).
          colcon build --symlink-install --packages-select px4_ros2_cpp
          source install/setup.bash
          # Stage 2: Build the project's own packages (and remaining
          # deps).  Skips unneeded examples from the
          # px4-ros2-interface-lib submodule.
          colcon build --symlink-install --packages-up-to \
            ackermann_control \
            safety \
            px4_bringup \
            robot_bringup \
            ackermann_nav2_bringup \
            rtabmap_bringup \
            description_robot
          colcon test --event-handlers console_direct+ --packages-select ackermann_control safety
          colcon test-result --verbose
