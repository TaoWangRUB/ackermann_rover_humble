name: build

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install lint dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ros-jazzy-ament-cpplint cppcheck

      - name: Run cpplint (ament)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          ament_cpplint src/ackermann_control src/safety

      - name: Run cppcheck static analysis
        shell: bash
        run: |
          set -euo pipefail
          cppcheck --enable=warning,performance,style --std=c++17 --error-exitcode=1 \
            src/ackermann_control/src \
            src/safety/src

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install package dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -y
          # rosdep may pull pip packages that shadow the system ament_package;
          # reinstall to guarantee the module is importable by CMake.
          sudo apt-get install -y --reinstall ros-jazzy-ament-package

      - name: Build and test
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          # Stage 1: Build px4_msgs then px4_ros2_cpp.
          # px4_ros2_cpp uses ament_index_get_resource() at configure
          # time to discover px4_msgs, and downstream packages
          # (px4_bringup) need px4_ros2_cpp's cmake config available.
          colcon build --symlink-install --packages-up-to px4_ros2_cpp
          source install/setup.bash
          # Stage 2: Build the project's own packages (and remaining
          # deps).  Skips unneeded examples from the
          # px4-ros2-interface-lib submodule.
          colcon build --symlink-install --packages-up-to \
            ackermann_control \
            safety \
            px4_bringup \
            robot_bringup \
            ackermann_nav2_bringup \
            rtabmap_bringup \
            description_robot
          colcon test --event-handlers console_direct+ --packages-select ackermann_control safety
          colcon test-result --verbose
