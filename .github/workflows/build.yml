name: build

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install lint dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-ament-lint cppcheck

      - name: Run cpplint (ament)
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          ament_cpplint src/ackermann_control src/safety

      - name: Run cppcheck static analysis
        shell: bash
        run: |
          set -euo pipefail
          cppcheck --enable=warning,performance,style --std=c++17 --error-exitcode=1 \
            src/ackermann_control/src \
            src/safety/src

  build:
    runs-on: ubuntu-24.04
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install package dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          rosdep update
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -y

      - name: Build and test
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          # Build px4_msgs first so its ament resource index
          # (rosidl_interfaces) is available at configure time
          # for px4_ros2_cpp's ament_index_get_resource() call.
          colcon build --symlink-install --packages-up-to px4_msgs
          source install/setup.bash
          colcon build --symlink-install
          colcon test --event-handlers console_direct+ --packages-select ackermann_control safety
          colcon test-result --verbose
