name: ai-review
on: [pull_request]
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Prepare CI submodules
        run: bash scripts/prepare_ci_submodules.sh
      - name: Run Autonomous Agent Verification
        run: bash scripts/verify_agent_work.sh
